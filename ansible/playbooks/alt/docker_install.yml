- hosts: astra
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install Docker
      apt:
        name: docker-engine
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Check Docker is working
      command: docker version
      register: docker_check
      changed_when: false

    - debug:
        var: docker_check.stdout